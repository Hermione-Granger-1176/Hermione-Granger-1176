name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - assets/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: Platane/snk/svg-only@e2cedf76a2c05b25d09a6428ded69727b497a700 # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23FFD100&color_dots=%23ebedf0,%23f0d090,%23e6b422,%23d4a017,%23c8960c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FFD100&color_dots=%23161b22,%23352a00,%23554400,%23997a00,%23FFD100

      - name: Detect snake updates
        id: changes
        run: |
          if [ -f assets/github-snake.svg ] && [ -f assets/github-snake-dark.svg ] \
            && cmp -s dist/github-snake.svg assets/github-snake.svg \
            && cmp -s dist/github-snake-dark.svg assets/github-snake-dark.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snake changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snake files changed."
          fi

      - name: Commit with GitHub App token (verified)
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!context.ref.startsWith("refs/heads/")) {
              core.setFailed(`Expected branch ref, got ${context.ref}`);
              return;
            }

            const branchName = context.ref.replace("refs/heads/", "");

            const { data: ref } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branchName}`,
            });

            const mutation = `
              mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    url
                  }
                }
              }
            `;

            const result = await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${owner}/${repo}`,
                  branchName,
                },
                expectedHeadOid: ref.object.sha,
                message: {
                  headline: "chore: update snake animation",
                },
                fileChanges: {
                  additions: [
                    {
                      path: "assets/github-snake.svg",
                      contents: fs.readFileSync("dist/github-snake.svg").toString("base64"),
                    },
                    {
                      path: "assets/github-snake-dark.svg",
                      contents: fs.readFileSync("dist/github-snake-dark.svg").toString("base64"),
                    },
                  ],
                },
              },
            });

            core.info(`Created commit: ${result.createCommitOnBranch.commit.url}`);
